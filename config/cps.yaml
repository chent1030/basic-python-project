enabled: true
# 内网直连：Java 后端（CpsAgentFrameworkClient）只填 Python 侧地址即可调用
# /api/v1/agent*，不带 token；Python 侧不再校验共享密钥（CPS_INTERNAL_API_KEY）
# 与 IP 白名单（trusted_networks），见 app/api/v1/endpoints/agent_runs.py::principal。
max_rounds: 40
max_image_bytes: 10000000
max_images: 20
history_days: 90
memory_limit: 5
embeddings:
  url: http://127.0.0.1:8090/image-embeddings
  model: siglip2-so400m-patch14-384
  api_key_env: null
  timeout: 30
  max_dimensions: 8192
