# =====================================================================
# 全局默认配置 — 请勿提交敏感信息,敏感项请放入 config/local.yaml
# =====================================================================
# 加载规则(无任何环境变量):
#   1. 始终加载本文件 config/config.yaml
#   2. 如果 config/local.yaml 存在,自动深合并覆盖(逐字段覆盖)
# 本地开发 / 生产:放(或不放、放不同内容的)config/local.yaml 即可。
# 所有配置文件均为 YAML,不使用 .env。

app:
  name: "fastapi-demo"
  env: "dev"           # dev / staging / prod
  debug: true
  host: "0.0.0.0"
  port: 8000
  api_prefix: "/api/v1"

# ---------------------------------------------------------------------
# 认证:默认关闭。需要认证的接口加 `@require_auth` 注解即可开启。
# ---------------------------------------------------------------------
auth:
  enabled: false                # 全局开关(默认关闭)
  algorithm: "HS256"
  secret_key: "change-me-in-local.yaml"
  access_token_expire_minutes: 60
  refresh_token_expire_days: 7

# ---------------------------------------------------------------------
# 密码加密(AES-256-GCM)
#   config.yaml 里所有 `enc:` 前缀字段会用此 key 解密。
#   生成新 key:python -m app.core.crypto genkey
#   加密密码:python -m app.core.crypto encrypt "你的明文密码"
#   留空 = 不启用加密(所有字段按明文处理)
# ---------------------------------------------------------------------
crypto:
  key: ""                      # base64 编码的 32 字节 key,用 genkey 生成后填入

# ---------------------------------------------------------------------
# 多数据源配置:任意数量、任意类型。
# type: postgresql | mysql | redis
#
# 默认留空 —— 不配任何数据源也能正常启动(只会跳过 DB 相关功能)。
# 把数据源放到 config/local.yaml 里(参考 local.yaml.example)。
#
# 两种配置方式:
#   1) 分段配置(推荐,密码可加密):
#        postgres_primary:
#          type: postgresql
#          host: 127.0.0.1
#          port: 5432
#          username: postgres
#          password: "enc:gKR8Y2..."   # enc: = 密文;无前缀 = 明文
#          database: app
#   2) 整串 DSN(简单):
#        postgres_primary:
#          type: postgresql
#          dsn: "postgresql+asyncpg://user:pass@host:5432/db"
#
# 池/超时参数对照 Spring Boot HikariCP:
#   pool_size + max_overflow ≈ maximumPoolSize
#   pool_timeout ≈ connectionTimeout  pool_recycle ≈ maxLifetime
#   pool_pre_ping ≈ connectionTestQuery
#   statement_timeout 仅 PostgreSQL(毫秒)
# ---------------------------------------------------------------------
datasources: {}                # 默认空;在 config/local.yaml 里配置真实数据源

# ---------------------------------------------------------------------
# LLM —— 多 provider(多个 NewAPI 地址),调用时按 provider 参数切换
# 通过 LangChain ChatOpenAI 连接,兼容 DeepSeek/Qwen/GLM/Kimi 等。
# 只发送国产模型都支持的最小参数集。NewAPI 会拒绝 OpenAI 专属参数。
#
# 不传 provider 时用 default_provider。api_key 支持 enc: 加密。
# ---------------------------------------------------------------------
llm:
  default_provider: ""                     # 默认 provider 名(对应 providers 下的 key)
  providers: {}                            # 在 config/local.yaml 配置真实 provider
  # providers 示例(放进 local.yaml):
  #   deepseek:
  #     base_url: "https://api.deepseek.com/v1"
  #     api_key: "enc:xxx"
  #     model: "deepseek-chat"
  #   qwen:
  #     base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  #     api_key: "sk-xxx"
  #     model: "qwen-plus"

# ---------------------------------------------------------------------
# HTTP 客户端默认值 (供 app/services/http_client.py 使用)
# 每次调用时传 kwargs 都能覆盖这里的值。
# ---------------------------------------------------------------------
http:
  timeout: 30.0
  max_connections: 100
  max_keepalive_connections: 20
  verify: true
  default_headers:
    User-Agent: "fastapi-demo/0.1"
    Accept: "application/json"

# ---------------------------------------------------------------------
# Prompt 系统:提示词文件存放在项目根目录的 prompts/ 下
# 支持三种格式:
#   - .yaml / .yml  结构化(可同时定义 system / user / metadata / variables)
#   - .txt          纯文本(只作为 user prompt)
#   - .j2/.jinja2   Jinja2 模板,与上述三种可自由组合
# ---------------------------------------------------------------------
prompts:
  dir: "prompts"
  default_format: "yaml"
  cache: true

# ---------------------------------------------------------------------
# 日志 — Spring Boot 风格 + 按天滚动归档
#   format:        console(彩色)| json(单行 JSON 给 ELK/Loki)
#   color:         console 模式是否彩色
#   file:          主日志文件路径;null = 只输出到控制台不写文件
#   rotation:      daily(每天午夜滚动)| hourly | weekly
#   backup_count:  保留多少天的历史归档(超期自动删除),推荐 30-90
#   max_file_size: 单文件大小上限(MB);0 = 不按大小滚动
#
# 归档效果(类似 Logback RollingFileAppender):
#   logs/app.log              当前正在写
#   logs/app.log.2026-07-14   昨天的归档
#   logs/app.log.2026-07-13   前天的归档
#   ...超过 backup_count 个的最老文件自动删除
# ---------------------------------------------------------------------
logging:
  level: "INFO"
  format: "console"          # console | json
  color: true
  file: "logs/app.log"       # 主日志文件;改 null 则不写文件
  rotation: "daily"          # daily | hourly | weekly
  backup_count: 30           # 保留 30 天历史日志
  max_file_size: 0           # MB;0 = 只按时间滚动,不按大小

# ---------------------------------------------------------------------
# 定时任务 —— APScheduler(@scheduled 装饰器,任务写在 app/tasks/ 下)
# - timezone:            cron 表达式按此时区解释
# - coalesce:            错过的多次执行合并为一次
# - max_instances:       同一任务最大并发实例(防重入)
# - misfire_grace_time:  任务超期多久内仍可执行(秒)
# ---------------------------------------------------------------------
scheduler:
  timezone: "Asia/Shanghai"
  coalesce: true
  max_instances: 1
  misfire_grace_time: 60

# ---------------------------------------------------------------------
# 数据库迁移(Alembic)
# - default_datasource: alembic upgrade / autogenerate 默认操作的数据源
#   临时切换:alembic -x datasource=mysql_business upgrade head
# ---------------------------------------------------------------------
alembic:
  default_datasource: "postgres_primary"

# ---------------------------------------------------------------------
# MinerU OCR 服务 —— 文档审核用(OCR 识别)
# MinerU 部署为独立 HTTP 服务,doc_review 把文件 POST 过去拿 OCR 结果。
# 在 local.yaml 配真实地址。
# ---------------------------------------------------------------------
mineru:
  url: ""                          # MinerU OCR API 地址,如 http://mineru:8000/ocr
  timeout: 120.0                   # OCR 耗时较长,默认 120s
  api_key: ""                      # 若 MinerU 需认证

# ---------------------------------------------------------------------
# 文档智能审核 —— entity(业务数据) + url(文档) → OCR → 并行检查 → 报告
# ---------------------------------------------------------------------
doc_review:
  enabled: true
  callback_timeout: 30.0           # 审核完成后回调外部系统的超时
  check_timeout: 180.0             # 单项检查(agent 调用)的超时
  max_file_size_mb: 30             # 单文件大小上限

# ---------------------------------------------------------------------
# Harness 框架 —— 会话记忆存储数据源
# ---------------------------------------------------------------------
harness:
  session_datasource: "postgres_primary"   # session_memory 中间件存历史消息的数据源

# ---------------------------------------------------------------------
# CPS Agent 初审 —— Java 回调地址 / 任务 wall-clock deadline
# 契约 C-02:POST {base_url}{path}(Python → Java 回传初审结果)
# base_url 可被环境变量 CPS_JAVA_CALLBACK_BASE_URL 覆盖(env 优先,部署层口径)
# ---------------------------------------------------------------------
cps_agent:
  initial_review:
    deadline_seconds: 480          # 整任务 wall-clock 8 分钟(<10min 留 Java 接管余量)
    similarity:                    # A6 雷同性阈值（可配置；暂定值，待真实业务样本校准）
      same_fail: 0.90              # 同单 short↔long 相似度 ≥0.90 → FAIL（短期/长期措施互抄）
      same_warn: 0.75              # 同单 ≥0.75 → WARN
      history_fail: 0.85           # 与同问题历史提交 ≥0.85 → FAIL（换皮重提）
      history_warn: 0.70           # 与历史 ≥0.70 → WARN
    model_check:                   # A7/A8 模型检查(qwen 系);enabled=false → SKIPPED 不伪造
      enabled: true
      provider: qwen               # 对应 llm.providers 的 key(local.yaml 配置)
      text_model: "qwen-plus"
      vision_model: "Qwen2.5-VL-7B-Instruct"
      temperature: 0.1
      field_budget_seconds: 90.0   # 单次模型调用(含重试一次)预算;4×90s < 480s
      max_images_per_side: 4       # 送视觉模型每侧照片上限
    rustfs:                        # object_key 附件读取;env CPS_STORAGE_* 优先(对齐 Java)
      endpoint: "http://127.0.0.1:9000"
      access_key: "admin"          # 本地开发默认(与 Java application.yml 一致)
      secret_key: "Ct0520.0402"
      bucket: "cps-attachments"
  java_callback:
    base_url: "http://127.0.0.1:8080"   # env CPS_JAVA_CALLBACK_BASE_URL 优先
    path: "/api/callbacks/initial-review/result"
    timeout_seconds: 10.0
    max_retries: 2                 # 技术重试 ≤2(30s/60s 退避)
    retry_backoff_seconds: [30.0, 60.0]
  # 周报项目（C1-C6 / §21 / 设计 §3.3 + §4）
  # sched_enabled / report_types / rustfs_bucket 默认由 env 覆盖：
  #   CPS_WEEKLY_REPORT_SCHED_ENABLED  ：false 关闭调度(开发机默认)；true 启动
  #   CPS_WEEKLY_REPORT_TYPES          ：逗号分隔，默认 cps-issue-inspection,room-check
  #   CPS_WEEKLY_REPORT_BUCKET         ：周报归档独立桶；空 → 复用 cps-attachments
  weekly_report:
    sched_enabled: false           # C3 — 默认关闭,生产部署置 true 启用 APScheduler
    report_types: ["cps-issue-inspection", "room-check"]
    rustfs_bucket: "cps-attachments"
    cron: "0 8 * * MON"            # Asia/Shanghai
    misfire_grace_time_seconds: 7200
    push_unavailable_reason: "推送未配置"
