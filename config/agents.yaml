providers:
  # 通义千问 Provider。
  # ⚠️ 安全提醒(R-N2):下方 api_key 曾以明文提交进 git 历史,请尽快在
  #    dashscope 控制台轮换;轮换后把新 key 写入环境变量 DASHSCOPE_API_KEY
  #    (env 优先,读取逻辑见 app/harness/kernel/infrastructure/models.py
  #    Models.create():api_key_env 命中环境变量时 yaml 值不生效),
  #    并将 yaml 的 api_key 置空或移入 config/local.yaml(gitignore)。
  # 用户裁决:波次 1 暂不轮换,yaml 现值保留不动。
  qwen:
    kind: openai
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: "DASHSCOPE_API_KEY"   # 环境变量覆盖优先(推荐投递方式)
    api_key: "sk-e36a95a1fb79492f994d91c535d4966a"
    timeout: 120
    max_retries: 2
models:
  cps_vision:
    provider: qwen
    model: Qwen2.5-VL-7B-Instruct
    parameters:
      temperature: 0.1
      max_tokens: 8192
    capabilities: [tools, structured_output, vision]
  default:
    provider: qwen
    model: qwen-turbo
    parameters:
      temperature: 0.1
      max_tokens: 4096
    capabilities: [tools, structured_output]
  reasoning_large:
    provider: qwen
    model: qwen-plus
    parameters:
      temperature: 0.2
      max_tokens: 8192
    capabilities: [tools, structured_output]
agents:
  coordinator: reasoning_large
  cps_main: reasoning_large
  cps_issue_identification: cps_vision
  cps_rectification_judgement: cps_vision
  cps_history_analysis: reasoning_large
  cps_coverage_analysis: reasoning_large
  cps_report: reasoning_large
  cps_work_plan: reasoning_large
  cps_observation: default
