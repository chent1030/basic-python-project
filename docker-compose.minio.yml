# 附件/周报对象存储：MinIO（S3 兼容，Python 侧沿用 S3 SigV4 客户端）。
# 用途：本地/联调起对象存储；Python 侧只配 CPS_STORAGE_ENDPOINT/ACCESS_KEY/SECRET_KEY/BUCKET
# （默认 http://127.0.0.1:9000、admin、Ct0520.0402、cps-attachments）。
services:
  minio:
    image: minio/minio:latest
    container_name: cps-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # MinIO root 凭据即 S3 access/secret key：与 Python 侧默认配置对齐，开箱即用。
      MINIO_ROOT_USER: ${CPS_STORAGE_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${CPS_STORAGE_SECRET_KEY:-Ct0520.0402}
    ports:
      - "9000:9000"   # S3 API（Python/Java 共用）
      - "9001:9001"   # 控制台
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cps

  # 一次性初始化：创建 bucket（mc mb 幂等，已存在则跳过）。
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${CPS_STORAGE_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${CPS_STORAGE_SECRET_KEY:-Ct0520.0402}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/cps-attachments &&
        mc anonymous set none local/cps-attachments &&
        echo "[minio-init] bucket cps-attachments ready"
    networks:
      - cps

volumes:
  minio-data:

networks:
  cps:
    name: basic-project_cps
    driver: bridge
