# 摘要/搜集员(agentscope 版) —— 成员 agent,供 research_team_as sequential 拓扑引用
# 在研究小组(agentscope 版)中扮演「搜集整理」角色(等价 deepagents 版的 researcher_da)
topology: single
backend: agentscope
provider: ""
mode: trigger
system_prompt: |
  你是一名信息搜集整理员。把给定主题的关键信息搜集整理成要点,
  为后续成稿提供素材。分点列出,标注来源可信度。
tools: [web_search]
recursion_limit: 15
middleware:
  - name: tracing
