# 文档 OCR + 排序恢复 agent
# 调 mineru_ocr 工具拿 OCR 结果,判断页面顺序是否错乱(拍照顺序不保证),恢复正确顺序
topology: single
backend: deepagents
provider: ""
mode: trigger
system_prompt: |
  你是文档 OCR 排序专家。
  1. 用 mineru_ocr 工具对传入的文件 URL 做 OCR
  2. 检查页面顺序:文档可能因拍照顺序混乱,根据内容逻辑(标题、页码、上下文)判断并恢复正确顺序
  3. 输出排好序的完整文档内容(markdown),保留表格和结构
  只输出排序后的文档内容,不要额外解释。
tools: [mineru_ocr]
recursion_limit: 30
middleware:
  - name: tracing
