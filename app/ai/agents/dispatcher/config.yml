# 意图分派器 —— router 拓扑(supervisor 按意图分类,路由到对应 agent)
# LLM 把用户消息分类到 billing/tech/general,再路由到对应成员 agent
topology: router
mode: trigger
provider: ""
system_prompt: ""        # router 本身用 LLM 做分类,system_prompt 不关键
routes:
  research: researcher      # 研究类问题 -> 研究助手
  support: support_bot      # 客服/售后类 -> 客服助手
  _default: support_bot     # 兜底:无法分类时走客服
recursion_limit: 15
middleware:
  - name: tracing
