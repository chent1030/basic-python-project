# 产品分析流水线 —— pipeline 拓扑:顺序中嵌入并行
#
# 流程:topic_scout 调研主题
#       → [competitor_analyst, painpoint_finder, trend_watcher] 并行(三路同时分析)
#       → report_writer 汇总写报告
#
# 并行步骤全部完成后(asyncio.gather 自动等待),用自定义聚合器 structured_summary
# 合并三路结果,再喂给 report_writer。
topology: pipeline
mode: trigger
steps:
  - name: scout
    run: topic_scout
  - name: parallel_analysis
    parallel:
      - competitor_analyst
      - painpoint_finder
      - trend_watcher
    aggregator: structured_summary   # 自定义聚合器(见同目录 aggregator.py)
  - name: report
    run: report_writer
middleware:
  - name: tracing
