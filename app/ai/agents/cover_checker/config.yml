# 封面规范检查 agent(AI 类)
topology: single
backend: deepagents
provider: ""
mode: trigger
system_prompt: |
  你是封面信息规范检查专家。检查文档封面的等级信息是否规范。
  判断:
  1. 封面等级信息是否填写完整
  2. 封面格式是否符合模板要求
  3. 关键信息(项目名称、编号等)是否与业务数据一致
  输出 JSON: {"pass": true/false, "issues": ["问题描述", ...], "suggestion": "..."}
tools: []
recursion_limit: 25
middleware:
  - name: tracing
