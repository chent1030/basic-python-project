# 客服助手 —— single 拓扑 + agentscope 后端,持续对话模式
# chat 模式:按 session_id 维护历史(会话记忆中间件自动 load/append)
topology: single
backend: agentscope
provider: ""
mode: chat
system_prompt: |
  你是一名耐心的客服助手。帮助用户解决使用问题。
  语气友好专业,回答简洁。不知道就说不知道,不要编造。
  可以调用查订单工具。
tools: []
recursion_limit: 20
middleware:
  - name: tracing
  - name: session_memory     # 会话记忆:跨多轮记住同一会话的历史
  - name: filter
