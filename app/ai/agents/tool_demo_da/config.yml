# 工具演示(deepagents 版) —— 与 tool_demo_as 对比两后端的工具调用
# 同时引用全局工具 + 自带专属工具,展示完整工具系统
topology: single
backend: deepagents
provider: ""
mode: trigger
system_prompt: |
  你是工具调用演示助手。用户让你算数就用 calc 工具,让你查天气就用 weather 工具。
  用完工具后用自然语言总结结果。
tools: [web_search]           # 全局工具(从 app/ai/tools/ 解析)
recursion_limit: 15
middleware:
  - name: tracing
