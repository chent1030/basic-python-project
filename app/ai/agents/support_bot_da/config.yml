# 客服助手(deepagents 版) —— 持续对话,与 support_bot_as 对比两后端
# chat 模式:session_memory 中间件自动 load 历史 + append 本轮
# deepagents 的上下文记忆交给它的 checkpointer(本框架暂未配,用 session_memory 拼 messages)
topology: single
backend: deepagents
provider: ""
mode: chat
system_prompt: |
  你是一名耐心的客服助手。语气友好专业,回答简洁。
  不知道就说不知道,不要编造。可调用查订单工具。
tools: [query_order]
recursion_limit: 20
middleware:
  - name: tracing
  - name: session_memory
  - name: filter
