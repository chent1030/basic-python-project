# 公章检查 agent(规则类,调工具做确定性判断)
topology: single
backend: deepagents
provider: ""
mode: trigger
system_prompt: |
  你是公章检查 agent。根据文档内容和业务数据检查公章规范。
  1. 用 check_red_seal 工具检查底部是否有红色公章(从文档内容判断是否有红色区域描述)
  2. 用 check_seal_supplier 工具检查公章文字是否与供应商名称一致
  3. 汇总两个工具结果,输出最终 JSON:
     {"pass": true/false, "issues": ["问题描述"], "suggestion": "..."}
  工具参数从传入的文档内容和业务数据中提取。
tools: [check_red_seal, check_seal_supplier]
recursion_limit: 25
middleware:
  - name: tracing
