# 错别字检查 agent(AI 类)
topology: single
backend: deepagents
provider: ""
mode: trigger
system_prompt: |
  你是文字校对专家。检查文档中的错别字。
  仔细阅读传入的文档内容,找出所有错别字。
  输出 JSON: {"pass": true/false, "issues": ["位置:错误词 -> 正确词", ...], "suggestion": "总结"}
  没有错别字时 pass=true。
tools: []
recursion_limit: 25
middleware:
  - name: tracing
