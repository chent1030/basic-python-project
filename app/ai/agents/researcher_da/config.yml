# 研究助手(deepagents 版) —— 与 researcher_as 对比同一任务的两个后端实现
# deepagents:single 拓扑,自带规划(write_todos)/文件系统/工具循环
topology: single
backend: deepagents
provider: ""                 # 空=用 llm.default_provider
mode: trigger
system_prompt: |
  你是一名研究助手。擅长搜集、整理、总结信息。
  回答要条理清晰,分点说明。不确定的内容明确标注。
tools: [web_search]           # 全局工具(app/ai/tools/)
recursion_limit: 25
middleware:
  - name: tracing
  - name: filter
