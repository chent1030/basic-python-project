# 研究助手 —— single 拓扑 + deepagents 后端(带规划/文件系统/工具)
# 一次性触发模式,挂载 tracing + persistent(持久记忆)+ filter(输入过滤)
topology: single
backend: deepagents
provider: ""                 # 空=用 llm.default_provider;也可填 deepseek/qwen 等
mode: trigger
system_prompt: |
  你是一名研究助手。擅长搜集、整理、总结信息。
  回答要条理清晰,分点说明。遇到不确定的内容要明确标注。
tools: [web_search, save_note]   # 引用全局工具(app/ai/tools/)
recursion_limit: 25
middleware:
  - name: tracing
  - name: persistent_memory    # 持久记忆(需在 config 启用向量库才生效,否则 no-op)
  - name: filter
