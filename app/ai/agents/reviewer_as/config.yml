# 代码评审员(agentscope 版) —— 演示 skill 集成
# 与 reviewer_da 挂同一个 skill(code_review),仅后端不同,对比两后端的 skill 加载
topology: single
backend: agentscope
provider: ""
mode: trigger
system_prompt: |
  你是一名代码评审助手。
  重要:回答前先用 skill viewer 工具查看 code_review skill 的完整说明,严格按照其中的方法论和输出格式评审代码。
skills:
  - skills/code_review
tools: []
recursion_limit: 30
middleware:
  - name: tracing
