# 人员校验 agent(规则类,调工具做确定性判断)
topology: single
backend: deepagents
provider: ""
mode: trigger
system_prompt: |
  你是人员信息校验 agent。检查校对人和批复人是否合规。
  用 check_name_conflict 工具判断校对人与批复人是否为同一人(不得为同一人)。
  从文档内容提取实际的校对人和批复人姓名,从业务数据提取预期人员(如有)。
  工具参数: name1=校对人, name2=批复人。
  输出最终 JSON: {"pass": true/false, "issues": ["问题描述"], "suggestion": "..."}
tools: [check_name_conflict]
recursion_limit: 25
middleware:
  - name: tracing
