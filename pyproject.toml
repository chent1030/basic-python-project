[project]
name = "fastapi-demo"
version = "0.1.0"
description = "FastAPI template with multi-datasource switching, OpenAI, optional auth, MySQL/PostgreSQL/Redis async."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.120.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    # SQLAlchemy 2.x async
    "sqlalchemy[asyncio]>=2.0.30",
    # Async drivers — keep all three so any datasource can be enabled at runtime
    "asyncpg>=0.29.0",          # PostgreSQL async driver
    "aiomysql>=0.2.0",          # MySQL async driver
    "redis[hiredis]>=5.0.0",    # Redis async (redis.asyncio)
    # Auth
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    # 密码加密(AES-GCM,数据库密码等敏感字段加密后填入 config.yaml)
    "cryptography>=42.0",
    # 定时任务(APScheduler,cron + 固定间隔,装饰器配置)
    "apscheduler>=3.10.0",
    # 数据库迁移(Alembic,类似 Flyway/Liquibase)
    "alembic>=1.13.0",
    # LLM via LangChain — ChatOpenAI connects to NewAPI (OpenAI-compatible endpoints)
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    # Utils
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",          # prompt template rendering (optional but recommended)
    # AI Agent 框架(两种 agent 库 + 持久记忆向量库)
    "deepagents>=0.6.12",     # 单 agent 深度任务 + subagent 委派(LangChain/LangGraph)
    "agentscope>=2.0.5",      # 多 agent 编排(顺序/并行/协作对话)
    "pgvector>=0.3.0",        # 持久记忆向量库(独立于业务库,与业务数据隔离)
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    # Alembic 同步驱动(alembic upgrade 走同步路径,需要同步驱动)
    # 对应数据源:postgresql 用 psycopg2,mysql 用 pymysql
    "psycopg2-binary>=2.9",
    "pymysql>=1.1",
    # 测试用 in-memory SQLite 驱动(test_repositories / test_agents 用)
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
# We ship only the `app` package; `config/` holds YAML files read at runtime.

[tool.setuptools.package-data]
app = ["py.typed"]

# Tell the `fastapi` CLI which app to run.
[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic 自动生成的迁移文件不参与 lint(工具生成的代码)
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI uses Depends(...) / Path(...) / Query(...) in default args by design.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
