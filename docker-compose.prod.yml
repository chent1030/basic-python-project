# =============================================================================
# 生产部署用 docker-compose —— 从 JFrog 镜像仓库拉取(不本地构建)
#
# 推荐用 deploy.sh 一键部署(自动 login JFrog + pull + migrate + up):
#   ./deploy.sh deploy
#
# 也可手动:
#   docker login your-jfrog.company.com -u 用户名 -p 密码
#   docker compose -f docker-compose.prod.yml --env-file .env pull
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# 镜像地址通过环境变量 IMAGE_NAME / IMAGE_TAG 控制(由 .env 注入):
#   IMAGE_NAME=your-jfrog.company.com/docker-local/fastapi-demo
#   IMAGE_TAG=latest        # 或具体版本号 v1.0.0 / commit sha
# =============================================================================

services:
  app:
    # 镜像名:tag 从环境变量取(.env 注入),不从源码 build
    image: "${IMAGE_NAME:-your-jfrog.company.com/docker-local/fastapi-demo}:${IMAGE_TAG:-latest}"
    container_name: fastapi-demo-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      TZ: Asia/Shanghai
    volumes:
      # 运行时配置通过卷挂载覆盖(config/local.yaml 含数据库密码、LLM key 等)
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro
      # skills 目录(如需在线更新 skill,也挂卷;否则用镜像内置的)
      - ./skills:/app/skills:ro
      # 日志持久化
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - demo-net
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  # ---------------- PostgreSQL(含 agent_sessions/agent_runs/agent_memories 表)---
  # 注意:生产环境建议用外部托管 PG;这里提供单机方案。
  # 持久记忆(pgvector)若启用,需要独立 PG + CREATE EXTENSION vector;
  # 见 config/local.yaml.example 的 agents.persistent_memory 段。
  postgres:
    image: "${POSTGRES_IMAGE:-postgres:16-alpine}"
    container_name: fastapi-demo-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-app}"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - demo-net

  # ---------------- Redis ----------------
  redis:
    image: "${REDIS_IMAGE:-redis:7-alpine}"
    container_name: fastapi-demo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - demo-net

  # MySQL 按需启用(默认注释掉;取消注释即用)
  # mysql:
  #   image: "${MYSQL_IMAGE:-mysql:8.0}"
  #   container_name: fastapi-demo-mysql
  #   restart: unless-stopped
  #   command: --default-authentication-plugin=caching_sha2_password --charset-server=utf8mb4
  #   environment:
  #     MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
  #     MYSQL_DATABASE: "${MYSQL_DATABASE:-business}"
  #   volumes:
  #     - mysql-data:/var/lib/mysql
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10
  #   networks:
  #     - demo-net

volumes:
  pg-data:
  redis-data:
  # mysql-data:

networks:
  demo-net:
    driver: bridge
