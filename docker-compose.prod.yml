# =============================================================================
# 生产部署用 docker-compose —— 在服务器上从源码构建镜像后运行
#
# 推荐用 deploy.sh 一键部署(自动 login JFrog + build + migrate + up):
#   ./deploy.sh deploy
#
# 构建时基础镜像(python)和 Python 包都走 JFrog 代理(公司内网),
# 由 deploy.sh 通过 --build-arg 注入,这里不写死。
#
# 也可手动:
#   docker login your-jfrog.company.com -u 用户名 -p 密码
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# =============================================================================

services:
  app:
    # 从源码构建(build),不拉远程应用镜像。
    # build args 由 deploy.sh/.env 传入(基础镜像 + PyPI 源走 JFrog)。
    # uv 用 pip 从 UV_INDEX_URL 装,不走 astral.sh 脚本。
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: "${PYTHON_BASE_IMAGE:-python:3.11-slim}"
        UV_INDEX_URL: "${UV_INDEX_URL:-}"
        UV_INDEX_USER: "${UV_INDEX_USER:-}"
        UV_INDEX_PASSWORD: "${UV_INDEX_PASSWORD:-}"
    image: "${APP_IMAGE:-fastapi-demo:latest}"   # 构建出的本地镜像名
    container_name: fastapi-demo-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-18555}:18555"
    environment:
      TZ: Asia/Shanghai
    volumes:
      # 运行时配置通过卷挂载覆盖(config/local.yaml 含数据库密码、LLM key 等)
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro
      # skills 目录(如需在线更新 skill,也挂卷;否则用镜像内置的)
      - ./skills:/app/skills:ro
      # 日志持久化
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - demo-net
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  # ---------------- PostgreSQL(含 agent_sessions/agent_runs/agent_memories 表)---
  # 注意:生产环境建议用外部托管 PG;这里提供单机方案。
  # 持久记忆(pgvector)若启用,需要独立 PG + CREATE EXTENSION vector;
  # 见 config/local.yaml.example 的 agents.persistent_memory 段。
  postgres:
    image: "${POSTGRES_IMAGE:-postgres:16-alpine}"
    container_name: fastapi-demo-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-app}"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - demo-net

  # ---------------- Redis ----------------
  redis:
    image: "${REDIS_IMAGE:-redis:7-alpine}"
    container_name: fastapi-demo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - demo-net

  # MySQL 按需启用(默认注释掉;取消注释即用)
  # mysql:
  #   image: "${MYSQL_IMAGE:-mysql:8.0}"
  #   container_name: fastapi-demo-mysql
  #   restart: unless-stopped
  #   command: --default-authentication-plugin=caching_sha2_password --charset-server=utf8mb4
  #   environment:
  #     MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
  #     MYSQL_DATABASE: "${MYSQL_DATABASE:-business}"
  #   volumes:
  #     - mysql-data:/var/lib/mysql
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10
  #   networks:
  #     - demo-net

volumes:
  pg-data:
  redis-data:
  # mysql-data:

networks:
  demo-net:
    driver: bridge
